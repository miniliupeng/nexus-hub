version: '3.8'

services:
  # 1. 核心持久化关系型数据库 (MySQL 8.0)
  mysql:
    image: mysql:8.0.36
    container_name: nexus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: nexus_root_2026
      MYSQL_DATABASE: nexus_hub
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pnexus_root_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. 分布式缓存与 Asynq 任务队列底座 (Redis 7.2)
  redis:
    image: redis:7.2-alpine
    container_name: nexus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. 分布式协调与动态配置中心 (ETCD v3.5)
  etcd:
    image: bitnami/etcd:3.5
    container_name: nexus_etcd
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd

  # 4. S3 协议对象存储 (MinIO)
  minio:
    image: minio/minio:latest
    container_name: nexus_minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API 接口端点
      - "9001:9001" # Web 控制台界面
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
